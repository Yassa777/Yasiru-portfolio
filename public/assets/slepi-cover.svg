<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="blur-xl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E9D3"/>
      <stop offset="0.42" stop-color="#FBE4CB"/>
      <stop offset="1" stop-color="#F4E7DB"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9EE"/>
      <stop offset="1" stop-color="#FFF7F0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#paper)"/>

  <g filter="url(#blur-xl)" opacity="0.9">
    <ellipse cx="350" cy="260" rx="370" ry="280" fill="#F0C15D"/>
    <ellipse cx="1040" cy="200" rx="460" ry="280" fill="#F27A52"/>
    <ellipse cx="1210" cy="870" rx="360" ry="240" fill="#F2A07E"/>
    <ellipse cx="290" cy="940" rx="360" ry="270" fill="#98C7CA"/>
    <ellipse cx="760" cy="610" rx="520" ry="310" fill="#F7B45C"/>
    <ellipse cx="1070" cy="520" rx="260" ry="220" fill="#F4C3B2"/>
  </g>

  <g opacity="0.8">
    <ellipse cx="270" cy="290" rx="170" ry="200" fill="url(#cloud)"/>
    <ellipse cx="680" cy="170" rx="250" ry="120" fill="url(#cloud)"/>
    <ellipse cx="1270" cy="360" rx="210" ry="260" fill="url(#cloud)"/>
    <ellipse cx="420" cy="860" rx="250" ry="190" fill="url(#cloud)"/>
    <ellipse cx="1120" cy="940" rx="250" ry="160" fill="url(#cloud)"/>
  </g>

  <g opacity="0.25" stroke="#FFF9F0" stroke-width="4">
    <path d="M286 645C417 544 542 492 681 525C810 555 891 646 1025 652"/>
    <path d="M290 694C420 778 553 800 677 754C798 710 896 635 1030 666"/>
    <path d="M624 336C697 429 734 530 716 650C699 771 640 846 572 917"/>
    <path d="M1037 272C982 351 959 434 971 544C982 654 1038 733 1114 811"/>
  </g>

  <g filter="url(#grain)">
    <rect width="1600" height="1200" fill="#000" opacity="0.7"/>
  </g>

  <g opacity="0.95">
    <circle cx="140" cy="132" r="5" fill="#C66345"/>
    <circle cx="260" cy="88" r="3.5" fill="#B6B436"/>
    <circle cx="498" cy="152" r="4.5" fill="#D7423D"/>
    <circle cx="1356" cy="192" r="6" fill="#D54837"/>
    <circle cx="1450" cy="902" r="5.5" fill="#D84B43"/>
    <circle cx="1184" cy="1022" r="4" fill="#2D87C6"/>
    <circle cx="924" cy="1088" r="5" fill="#D74841"/>
    <circle cx="322" cy="1032" r="4.5" fill="#95AD4E"/>
    <circle cx="892" cy="934" r="4" fill="#D44234"/>
  </g>
</svg>
